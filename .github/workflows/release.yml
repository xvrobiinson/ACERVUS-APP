name: Release

# A push to main only runs checks: version (summary), format, dependency audit,
# clippy and tests. It never builds the installer and never publishes.
#
# A release is made only by hand, for one exact commit the owner approved:
# Actions > Release > Run workflow, branch main, then fill in two boxes:
#   sha:     the approved commit, all 40 characters
#   confirm: "build release draft " followed by the first 7 characters of sha
# That builds the Windows installer and creates a DRAFT GitHub Release. The
# owner tests the draft installer, then publishes it with:
#   gh release edit vX.Y.Z --draft=false --latest
#
# Why a draft is safe: the website worker and the app's update check read
# GitHub's releases/latest, which ignores drafts (worker/index.ts in the PWA
# repo). Nothing reaches users until the owner publishes the draft.
#
# Versioning: Cargo.toml sets MAJOR.MINOR; CI assigns the next PATCH from the
# existing v* tags (see scripts/ci/next-version.sh). Nothing is committed back.
# A draft does not create the git tag, so a second manual run for the same
# commit reuses the same version and updates the same draft.
#
# The first step of the manual run checks everything before any code is
# fetched. Nothing is built unless: the run is on main, the owner started it
# (and the owner re-ran it, if it is a re-run), sha is 40 lowercase hex
# characters, confirm matches it, the run's commit is that sha, and main still
# points at that sha. If anything is off, the run ends red with "Nothing was
# built". If main moved after the approval, renew the approval with the new
# sha; an old run or an old sha never builds newer or older code.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/screenshots/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      sha:
        description: "The approved commit, all 40 characters"
        required: true
        type: string
      confirm:
        description: 'Type "build release draft " and the first 7 characters of sha, to build the installer and create a draft release from main.'
        required: true
        type: string

# Pushes still cancel older push checks. Confirmed manual runs share one group
# and never cancel a running build: a later one waits (GitHub keeps only the
# newest waiting run). A manual run without the confirm prefix gets a group of
# its own, so it can never cancel or replace an authorized build (the gate step
# does the exact check).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || (startsWith(inputs.confirm, 'build release draft ') && 'release' || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      previous_tag: ${{ steps.next.outputs.previous_tag }}
      exists: ${{ steps.next.outputs.exists }}
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      # Fails red, before any checkout, unless this manual run is for the exact
      # commit the owner approved. All inputs reach the script as environment
      # variables, never pasted into the script text.
      - id: gate
        name: Build only the approved commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          RUN_SHA: ${{ github.sha }}
          APPROVED_SHA: ${{ inputs.sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          fail() { echo "::error::Nothing was built. $1"; exit 1; }
          [[ "$REF" == "refs/heads/main" ]] || fail "Run the workflow on the main branch."
          [[ "$ACTOR" == "$OWNER" && "$TRIGGERING_ACTOR" == "$OWNER" ]] \
            || fail "Only the repository owner may start or re-run a release."
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail "sha must be the approved commit: all 40 characters, lowercase."
          [[ "$CONFIRM" == "build release draft ${APPROVED_SHA:0:7}" ]] \
            || fail "Type exactly: build release draft ${APPROVED_SHA:0:7}"
          [[ "$RUN_SHA" == "$APPROVED_SHA" ]] \
            || fail "This run is for commit ${RUN_SHA}, not the approved ${APPROVED_SHA}."
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" \
            || fail "Could not read the head of main."
          [[ "$head" == "$APPROVED_SHA" ]] \
            || fail "main changed after approval: renew the approval. main is at ${head}."
          echo "approved=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: next
        name: Work out the release version
        run: bash scripts/ci/next-version.sh

      - name: Summary
        env:
          VERSION: ${{ steps.next.outputs.version }}
          PREVIOUS: ${{ steps.next.outputs.previous_tag }}
          EXISTS: ${{ steps.next.outputs.exists }}
        run: |
          {
            echo "### Acervus Finance ${VERSION}"
            echo "Previous release: ${PREVIOUS:-none}"
            if [[ "$EXISTS" == "true" ]]; then echo "This commit is already released; build and publish are skipped."; fi
            echo "A push only runs checks. To make a draft release, run this workflow by hand on main."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Format
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt && rustup default "$RUST_TOOLCHAIN"

      - name: Check formatting
        run: cargo fmt --all --check

  audit:
    name: Dependency audit
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit

      - name: Check RustSec advisories
        run: cargo audit

  # Pushes are still checked with clippy and tests. A manual release runs the
  # same two steps inside the build job instead, so they are not run twice.
  test:
    name: Clippy and tests
    needs: version
    if: github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component clippy
          rustup default $env:RUST_TOOLCHAIN

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      - name: Stamp version ${{ env.VERSION }}
        run: ./scripts/ci/set-version.ps1 -Version $env:VERSION

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked

  build:
    name: Build Windows installer
    needs: version
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.version.outputs.approved == 'true' &&
      needs.version.outputs.exists != 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component clippy
          rustup default $env:RUST_TOOLCHAIN

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      - name: Stamp version ${{ env.VERSION }}
        run: ./scripts/ci/set-version.ps1 -Version $env:VERSION

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Check binary version
        run: |
          $info = (Get-Item target\release\acervus.exe).VersionInfo
          if ($info.ProductVersion -ne $env:VERSION) { throw "Binary reports '$($info.ProductVersion)', expected '$env:VERSION'" }
          "acervus.exe $($info.ProductVersion), $([math]::Round((Get-Item target\release\acervus.exe).Length / 1MB, 1)) MB"

      - name: Sign binary
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: ./scripts/ci/sign.ps1 target\release\acervus.exe

      - name: Build installer
        run: |
          $paths = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup 6 is not available" }
          & $iscc /Qp "/DAppVersion=$env:VERSION" installer\acervus.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - name: Sign installer
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: ./scripts/ci/sign.ps1 "dist\AcervusFinance-Setup-$env:VERSION.exe"

      - name: Checksum
        working-directory: dist
        run: |
          $name = "AcervusFinance-Setup-$env:VERSION.exe"
          # The same installer under a name that never changes, so the website's
          # "Download for Windows" can link to releases/latest/download/... and
          # start the download directly.
          Copy-Item $name "AcervusFinance-Setup.exe"
          $lines = foreach ($n in $name, "AcervusFinance-Setup.exe") { "$((Get-FileHash $n -Algorithm SHA256).Hash.ToLower())  $n" }
          $lines | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acervus-finance-${{ env.VERSION }}-windows-x64
          path: |
            dist/AcervusFinance-Setup-${{ env.VERSION }}.exe
            dist/AcervusFinance-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Create draft GitHub Release
    needs: [version, lint, audit, build]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.version.outputs.approved == 'true' &&
      needs.version.outputs.exists != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acervus-finance-${{ env.VERSION }}-windows-x64
          path: dist

      # whats-new.json: this version's changes in plain words, in English and
      # Spanish. Published with the installer when it is for this version
      # (same MAJOR.MINOR); the app's "Update available" window shows it.
      - name: Add what's new
        run: |
          if [[ -f whats-new.json && "$(jq -r .version whats-new.json)" == "$(cut -d. -f1,2 <<< "$VERSION")" ]]; then
            cp whats-new.json dist/
          else
            echo "::warning::whats-new.json is missing or not for ${VERSION}; the release has no plain-words notes"
          fi

      - name: Write release notes
        run: |
          {
            echo "## Acervus Finance ${VERSION}"
            echo
            if [[ -f dist/whats-new.json ]]; then
              echo "### What's new"
              echo
              jq -r '.en[] | "- " + .' dist/whats-new.json
              echo
              echo "### Novedades"
              echo
              jq -r '.es[] | "- " + .' dist/whats-new.json
              echo
            fi
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "Changes since ${PREVIOUS_TAG}:"
              echo
              git log --no-merges --pretty='- %s (%h)' "${PREVIOUS_TAG}..${GITHUB_SHA}"
            else
              echo "First release."
            fi
            echo
            echo "### Install"
            echo
            echo "Download \`AcervusFinance-Setup-${VERSION}.exe\` and run it. Works on Windows 10 (version 1809 or later) and Windows 11, 64-bit. Made by VZ Labs. Upgrades keep your data, which now lives in \`%LOCALAPPDATA%\\VZ Labs\\Acervus\`."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 dist/SHA256SUMS.txt)\`"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Always a draft, never "latest". Drafts are invisible to releases/latest,
      # which the website worker and the app's update check read. The owner
      # tests the installer, then publishes with
      # `gh release edit vX.Y.Z --draft=false --latest`.
      # A draft has no git tag yet, so a re-run may find the draft of an earlier
      # manual run: it is updated and stays a draft.
      - id: publish
        name: Create draft release ${{ env.TAG }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A draft has no git tag yet, so a later manual run gets the same
            # version. Never touch a release that is already public, and move
            # the draft to this commit so its tag will match the new installer.
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "::error::Release $TAG is already published. Bump the version instead."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=true --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Acervus Finance ${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --draft
          fi
          url="$(gh release view "$TAG" --json url --jq .url)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "Draft release created: [Acervus Finance ${VERSION}](${url})"
            echo
            echo "It is not public yet. Test the draft installer, then publish it with:"
            echo
            echo "\`gh release edit ${TAG} --draft=false --latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
